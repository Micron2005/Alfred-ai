[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alfred-core"
version = "0.1.0"
description = "Alfred AI backend — persona, orchestration, tools"
requires-python = ">=3.11"
authors = [{ name = "Mukarram Mohammad Alam" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "anthropic>=0.39.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "python-multipart>=0.0.12",
    "faster-whisper>=1.0.3",
    "edge-tts>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-requests",
    "httpx-sse>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alfred_core"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI's `Depends()` in defaults is the standard pattern
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
