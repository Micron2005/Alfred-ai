name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: alfred-core (lint + typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alfred-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest -q

  web:
    name: alfred-web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alfred-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: alfred-web/package-lock.json

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
