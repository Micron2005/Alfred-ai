services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  alfred-core:
    build:
      context: ./alfred-core
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Mount the long-term memory archive (Phase 12b) from the host so
    # the user can browse / grep / edit memory notes outside Alfred.
    # Default falls back to a sibling folder next to the repo if
    # ``ALFRED_MEMORY_HOST_PATH`` isn't set in ``.env`` — handy on
    # Linux dev boxes. Windows users typically point this at
    # ``C:\Users\<them>\Documents\Alfred Memory``.
    volumes:
      - ${ALFRED_MEMORY_HOST_PATH:-./alfred-memory}:/app/alfred-memory
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alfred-web:
    build:
      context: ./alfred-web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined into the JS bundle at build time,
        # so they're forwarded as build args (not runtime env). To
        # change them, run `docker compose up --build`.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
        NEXT_PUBLIC_WAKE_KEYWORD: ${NEXT_PUBLIC_WAKE_KEYWORD}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    depends_on:
      - alfred-core
    ports:
      - "3000:3000"

volumes:
  postgres-data:
