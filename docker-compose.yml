services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  alfred-core:
    build:
      context: ./alfred-core
      dockerfile: Dockerfile
      # Skip the Whisper pre-warm on tiny ARM SBCs (<= 2 GiB RAM)
      # to avoid OOM during build. Comment out the line below on
      # an x86 box for the snappier first /voice/stt response.
      args:
        ALFRED_SKIP_MODEL_PREFETCH: ${ALFRED_SKIP_MODEL_PREFETCH:-0}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Mount the long-term memory archive (Phase 12b) from the host so
    # the user can browse / grep / edit memory notes outside Alfred.
    # Default falls back to a sibling folder next to the repo if
    # ``ALFRED_MEMORY_HOST_PATH`` isn't set in ``.env`` — handy on
    # Linux dev boxes. Windows users typically point this at
    # ``C:\Users\<them>\Documents\Alfred Memory``.
    volumes:
      - ${ALFRED_MEMORY_HOST_PATH:-./alfred-memory}:/app/alfred-memory
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Inherit the HEALTHCHECK from the Dockerfile so `docker compose ps`
    # shows real readiness — a "running" alfred-core is not the same as
    # one that's actually finished init_db() and is serving requests.

  alfred-web:
    build:
      context: ./alfred-web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined into the JS bundle at build time,
        # so they're forwarded as build args (not runtime env). To
        # change them, run `docker compose up --build`.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
        NEXT_PUBLIC_WAKE_KEYWORD: ${NEXT_PUBLIC_WAKE_KEYWORD}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    depends_on:
      alfred-core:
        # Wait for /health to actually return 200, not just for the
        # process to start. Saves ~10 s of "Alfred is unreachable"
        # errors in the browser on first boot.
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres-data:
